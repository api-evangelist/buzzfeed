aid: buzzfeed
name: BuzzFeed
description: >-
  BuzzFeed Inc. is a digital media company founded in 2006 and headquartered in New York City,
  best known for its viral entertainment, quizzes, pop-culture coverage, and commerce content.
  The company operates a portfolio of brands including the flagship BuzzFeed site, the news
  operation HuffPost, and the food brand Tasty, and produces video, podcasts, and shoppable
  content across web and social platforms. BuzzFeed is a publicly traded company (Nasdaq: BZFD)
  and monetizes through advertising, brand partnerships, and commerce. It does not publish a
  general-purpose public developer API program; its public machine-readable surface consists of
  content syndication (RSS feeds), an advertising/partnerships business, and a security.txt
  vulnerability-disclosure program via HackerOne. This profile was added to the API Evangelist
  network from an a16z portfolio lead and enriched with the provider's real public surface.
